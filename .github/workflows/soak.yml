name: Soak

on:
  schedule:
    # Nightly at 02:23 UTC.
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      # The soak test runs the whole stack — scheduler, SQLite store,
      # retention, live reloads — for minutes under the race detector and
      # asserts bounded rows and returned-to-baseline goroutines (D45).
      # Pushes skip it (the SOAK gate); this workflow is where it runs.
      - name: Soak (3 minutes, race detector)
        env:
          SOAK: '1'
          SOAK_DURATION: 3m
        run: go test -race -count=1 -timeout 15m -run TestSoak -v ./internal/store/
