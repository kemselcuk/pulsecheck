name: CI

on:
  push:
    branches:
      - main
      - 'faz-*'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Fuzz
        run: go test -fuzz=FuzzParse -fuzztime 30s ./internal/config/ -run '^$'

      - name: Bench
        run: go test -bench . -benchtime 200x -run '^$' ./internal/checker/ ./internal/store/ -benchmem

      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
